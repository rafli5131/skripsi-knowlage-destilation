[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "op3-label-reviewer"
version = "0.1.0"
description = "Local X11 reviewer for OP3 YOLO draft labels"
requires-python = ">=3.10"
dependencies = ["opencv-python>=4.8", "numpy>=1.24"]

[tool.setuptools]
packages = ["op3_label_reviewer"]
