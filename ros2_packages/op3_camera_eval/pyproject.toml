[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "op3-camera-eval"
version = "0.1.0"
description = "Offline exploratory evaluation of reviewed OP3 camera frames"
requires-python = ">=3.10"
dependencies = ["ultralytics>=8.4.130", "numpy>=1.26", "matplotlib>=3.8"]

[tool.setuptools]
packages = ["op3_camera_eval"]
