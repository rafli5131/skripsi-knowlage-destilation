[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "op3-reviewed-session-eval"
version = "0.1.0"
description = "Evaluation of arbitrary human-reviewed OP3 camera sessions"
requires-python = ">=3.10"
dependencies = ["op3-camera-eval>=0.1.0", "op3-multi-session-eval>=0.1.0", "ultralytics>=8.4.130", "matplotlib>=3.8"]

[tool.setuptools]
packages = ["op3_reviewed_session_eval"]
