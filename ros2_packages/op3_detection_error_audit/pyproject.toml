[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "op3-detection-error-audit"
version = "0.1.0"
description = "Offline visual audit of reviewed OP3 detection errors"
requires-python = ">=3.10"
dependencies = ["op3-camera-eval>=0.1.0", "Pillow>=10", "matplotlib>=3.8"]

[tool.setuptools]
packages = ["op3_detection_error_audit"]
